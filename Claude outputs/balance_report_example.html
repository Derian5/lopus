:root{--bg:#14100c;--panel:#1e1812;--line:#3a2e22;--text:#e9dfcd;--muted:#9a8b74;--gold:#e6b85c;--good:#7fd67a;--bad:#e8735a;--accent:#c9a46a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Georgia,"Times New Roman",serif}
header{padding:22px 28px;border-bottom:1px solid var(--line);background:linear-gradient(#211a13,#14100c)}
h1{margin:0;font-size:24px;letter-spacing:.06em;color:var(--gold)}h2{font-size:17px;color:var(--accent);margin:26px 0 10px;letter-spacing:.05em}
.meta{color:var(--muted);margin-top:6px}.cards{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 16px;min-width:140px}.card b{display:block;font-size:22px;color:var(--gold)}.card span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
nav{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line);background:#18130e;position:sticky;top:0}
nav button{background:none;border:0;color:var(--muted);padding:12px 16px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--gold);border-color:var(--gold)}main{padding:8px 28px 40px}section{display:none}section.on{display:block}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line)}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:normal;text-transform:uppercase;font-size:11px;letter-spacing:.08em;cursor:pointer;user-select:none}th:first-child,td:first-child{text-align:left}
tr:hover td{background:#261e16}.bar{display:inline-block;height:9px;border-radius:2px;background:var(--gold);vertical-align:middle;margin-right:8px}
.good{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}.wrap{overflow-x:auto}
.heat td.cell{color:#120d09;font-weight:bold;text-align:center}svg text{fill:var(--muted);font:11px Georgia,serif}
details{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin:6px 0;padding:6px 10px}summary{cursor:pointer}
.timeline{display:flex;gap:3px;flex-wrap:wrap;margin:8px 0}.pip{width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#120d09}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;color:var(--muted)}.legend i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
</style>

function heatColor(r){const a=[232,115,90],b=[230,184,92],c=[127,214,122];const m=r<.5?[a,b,r*2]:[b,c,(r-.5)*2];return `rgb(${m[0].map((x,i)=>Math.round(x+(m[1][i]-x)*m[2])).join(",")})`}

document.getElementById("meta").textContent=`Generated ${DATA.generated} · ${runs.length} runs · ${S.total_battles} battles · ${Object.entries(DATA.options||{}).map(([k,v])=>k+"="+v).join("  ")}`;
const wins=runs.filter(r=>r.result==="win").length;
[["Runs",runs.length],["Overall winrate",pct(wins/Math.max(runs.length,1))],["Battles simulated",S.total_battles],["Avg battles won",num(runs.reduce((a,r)=>a+r.battles_won,0)/Math.max(runs.length,1))]].forEach(([l,v])=>{const c=el("div",`<b>${v}</b><span>${l}</span>`);c.className="card";document.getElementById("cards").append(c)});

const tabs=[["styles","Play styles"],["heroes","Heroes"],["encounters","Encounters"],["runs","All runs"]];
tabs.forEach(([id,label],i)=>{const b=el("button",label);b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(id).classList.add("on")};document.getElementById("tabs").append(b);if(i===0){b.classList.add("on");document.getElementById(id).classList.add("on")}});

function sortable(t){t.querySelectorAll("th").forEach((th,i)=>th.onclick=()=>{const body=t.tBodies[0];const rows=[...body.rows];const asc=th.dataset.asc!=="1";th.dataset.asc=asc?"1":"0";rows.sort((a,b)=>{const x=a.cells[i].dataset.v??a.cells[i].textContent,y=b.cells[i].dataset.v??b.cells[i].textContent;const nx=parseFloat(x),ny=parseFloat(y);const c=isNaN(nx)||isNaN(ny)?String(x).localeCompare(String(y)):nx-ny;return asc?c:-c});rows.forEach(r=>body.append(r))})}
function table(headers,rows){const t=el("table");t.innerHTML=`<thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody></tbody>`;rows.forEach(r=>{const tr=el("tr");r.forEach(c=>{const td=el("td");if(typeof c==="object"&&c!==null){td.innerHTML=c.h;if(c.v!==undefined)td.dataset.v=c.v;if(c.c)td.className=c.c}else td.innerHTML=c;tr.append(td)});t.tBodies[0].append(tr)});sortable(t);const w=el("div");w.className="wrap";w.append(t);return w}
const rateCell=r=>({h:`<span class="bar" style="width:${Math.round(r*80)}px"></span>${pct(r)}`,v:r,c:rateClass(r)});

// Play styles
(function(){const sec=document.getElementById("styles");sec.append(el("h2","Win rate by play style"));
sec.append(table(["Style","Runs","Winrate","Avg battles won","Soldiers lost / battle","Hero deaths / battle","Avg final Hero level","Gold on Heroes","Gold on army","Resurrections","Rerolls"],styles.map(s=>{const o=S.styles[s];const sp=o.spent||{};return [NAMES[s]||s,o.runs,rateCell(rate(o)),num(o.battles_won/o.runs),num(o.soldiers_lost/Math.max(o.battles,1),2),num(o.hero_deaths/Math.max(o.battles,1),2),num(o.levels/o.runs),Math.round((sp.hero_items||0)/o.runs),Math.round(((sp.job_unlock||0)+(sp.job_capacity||0)+(sp.job_ability||0))/o.runs),Math.round((sp.resurrection||0)/o.runs),Math.round((sp.reroll||0)/o.runs)]})));
sec.append(el("p",`<span class="muted">Gold columns are averages per run.</span>`));
sec.append(el("h2","Survival: share of runs still alive after each battle"));
const maxB=Math.max(...runs.map(r=>r.battles.length),1);const W=900,H=260,P=36;const svg=[`<svg viewBox="0 0 ${W} ${H+30}" width="100%" style="max-width:${W}px;background:#1e1812;border:1px solid #3a2e22">`];
for(let y=0;y<=4;y++){const yy=P+(H-P*2)*y/4;svg.push(`<line x1="${P}" x2="${W-10}" y1="${yy}" y2="${yy}" stroke="#3a2e22"/><text x="4" y="${yy+4}">${100-y*25}%</text>`)}
for(let b=0;b<=maxB;b++){const x=P+(W-P-10)*b/maxB;svg.push(`<text x="${x-4}" y="${H+4}">${b}</text>`)}
const legend=el("div");legend.className="legend";
styles.forEach((s,i)=>{const rs=runs.filter(r=>r.style===s);const pts=[];for(let b=0;b<=maxB;b++){const alive=rs.filter(r=>r.battles_won>=b).length/Math.max(rs.length,1);pts.push(`${P+(W-P-10)*b/maxB},${P+(H-P*2)*(1-alive)}`)}svg.push(`<polyline fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="2.5" points="${pts.join(" ")}"/>`);legend.append(el("span",`<i style="background:${COLORS[i%COLORS.length]}"></i>${NAMES[s]||s}`))});
svg.push(`<text x="${W/2-40}" y="${H+24}">battles won</text></svg>`);sec.append(legend);sec.append(el("div",svg.join("")));
sec.append(el("h2","Where runs end (number of the lost battle)"));
sec.append(table(["Style",...Array.from({length:maxB},(_,i)=>"#"+(i+1))],styles.map(s=>{const d=S.styles[s].deaths_at||{};return [NAMES[s]||s,...Array.from({length:maxB},(_,i)=>{const n=d[String(i+1)]||0;return n?{h:String(n),c:"bad",v:n}:{h:"·",c:"muted",v:0}})]})));
})();

// Heroes
(function(){const sec=document.getElementById("heroes");const ids=Object.keys(S.heroes).sort((a,b)=>rate(S.heroes[b])-rate(S.heroes[a])||S.heroes[b].battles_won/S.heroes[b].runs-S.heroes[a].battles_won/S.heroes[a].runs);
sec.append(el("h2","Hero strength (all styles together)"));
sec.append(el("p",`<span class="muted">Winrate = share of runs with this Hero in the trio that reached the Demo End. Per-battle values only count battles the Hero fought. A Hero executed after the Act I Boss stops collecting battles. Click a column to sort.</span>`));
sec.append(table(["Hero","Runs","Winrate","Avg battles won","Damage / battle","Tanked / battle","Healing / battle","Kills / battle","Deaths / battle","Executed"],ids.map(id=>{const h=S.heroes[id];const b=Math.max(h.battles,1);return [h.name,h.runs,rateCell(rate(h)),{h:num(h.battles_won/h.runs),v:h.battles_won/h.runs},{h:Math.round(h.damage/b),v:h.damage/b},{h:Math.round(h.tanked/b),v:h.tanked/b},{h:Math.round(h.healing/b),v:h.healing/b},num(h.kills/b,2),{h:num(h.deaths/b,2),v:h.deaths/b,c:h.deaths/b>0.5?"bad":""},{h:pct(h.executed/h.runs),v:h.executed/h.runs}]})));
sec.append(el("h2","Average battles won with each Hero"));
const max=Math.max(...ids.map(id=>S.heroes[id].battles_won/S.heroes[id].runs),1);
const bars=el("div");ids.forEach((id,i)=>{const v=S.heroes[id].battles_won/S.heroes[id].runs;bars.append(el("div",`<span style="display:inline-block;width:110px">${S.heroes[id].name}</span><span class="bar" style="width:${Math.round(v/max*500)}px;background:${COLORS[i%COLORS.length]}"></span>${num(v)}`))});sec.append(bars);
sec.append(el("h2","Hero × play style"));
sec.append(el("p",`<span class="muted">Each cell: winrate · average battles won (runs). Colour follows how far the runs got out of ${DATA.route_battles} battles.</span>`));
const t=el("table");t.className="heat";t.innerHTML=`<thead><tr><th>Hero</th>${styles.map(s=>`<th>${NAMES[s]||s}</th>`).join("")}</tr></thead><tbody></tbody>`;
ids.forEach(id=>{const tr=el("tr");tr.append(el("td",S.heroes[id].name));styles.forEach(s=>{const o=S.hero_style[id+"|"+s];const td=el("td");if(o&&o.runs){const r=rate(o);const avg=o.battles_won/o.runs;td.className="cell";td.style.background=heatColor(Math.min(1,avg/Math.max(DATA.route_battles,1)));td.textContent=`${pct(r)} · ${num(avg)} (${o.runs})`}else{td.textContent="—";td.className="muted"}tr.append(td)});t.tBodies[0].append(tr)});
const w=el("div");w.className="wrap";w.append(t);sec.append(w);
})();

// Encounters
(function(){const sec=document.getElementById("encounters");sec.append(el("h2","Encounters by danger"));
const ids=Object.keys(S.encounters).sort((a,b)=>S.encounters[b].losses/S.encounters[b].fights-S.encounters[a].losses/S.encounters[a].fights);
sec.append(table(["Encounter","Act","Battle #","Fights","Loss rate","Soldiers lost / fight","Avg duration (s)","Timeouts"],ids.map(id=>{const e=S.encounters[id];const lr=e.losses/e.fights;return [e.name,e.act,Object.keys(e.numbers).sort((a,b)=>a-b).join(", "),e.fights,{h:pct(lr),v:lr,c:lr>=0.5?"bad":(lr<=0.1?"good":"")},num(e.soldiers_lost/e.fights,2),num(e.duration/e.fights),e.timeouts]})));
})();

// Runs
(function(){const sec=document.getElementById("runs");sec.append(el("h2","Every simulated run"));
sec.append(el("p",`<span class="muted">Green = clean win, gold = win with 4+ soldiers lost, red = loss. Hover a square for details.</span>`));
runs.forEach(r=>{const d=el("details");const heroes=r.heroes.map(h=>HN[h]||h).join(", ");const res=r.result==="win"?`<span class="good">WIN</span>`:`<span class="bad">${r.result.toUpperCase()}</span> at ${r.died_at}`;
d.innerHTML=`<summary><b>${NAMES[r.style]||r.style}</b> · seed ${r.seed} · ${heroes} · ${res} · ${r.battles_won} battles won${r.executed_hero?" · executed "+(HN[r.executed_hero]||r.executed_hero):""}${r.error?' · <span class="bad">'+r.error+'</span>':""}</summary>`;
const tl=el("div");tl.className="timeline";r.battles.forEach(b=>{const p=el("div",String(b.number));p.className="pip";p.style.background=b.win?(b.soldiers_lost>=4?"#e6b85c":"#7fd67a"):"#e8735a";p.title=`${b.encounter_name}: ${b.win?"win":"loss"}, ${b.duration}s, soldiers lost ${b.soldiers_lost}, heroes died ${b.heroes_died}, gold ${b.gold_before} -> ${b.gold_after}, levels ${b.hero_levels.join("/")}`;tl.append(p)});d.append(tl);
d.append(table(["#","Encounter","Result","Duration","Soldiers lost","Heroes died","Hero dmg","Army dmg","Gold before","Gold after","Hero levels","Items","Army"],r.battles.map(b=>[b.number,b.encounter_name,b.win?{h:"win",c:"good"}:{h:"loss",c:"bad"},b.duration,b.soldiers_lost,b.heroes_died,b.hero_damage,b.army_damage,b.gold_before,b.gold_after,b.hero_levels.join(" / "),b.items??"",Object.entries(b.army||{}).map(([k,v])=>`${k} ${v}`).join(", ")])));
sec.append(d)});
})();
</script>
</body>
